<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d3c6c" />
    <title>퇴사 다이어리</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="poster" aria-label="퇴사 다이어리 달력">
        <header class="poster-header">
          <div class="month-lockup">
            <h1 id="hero-month">NOV</h1>
            <div class="year-stack"><span id="hero-year-top">20</span><span id="hero-year-bottom">26</span></div>
          </div>
        </header>

        <section class="calendar-column" aria-label="날짜 선택">
          <div class="calendar-header">
            <div class="month-controls">
              <button class="icon-button" id="prev-month" aria-label="이전 달">‹</button>
              <button class="icon-button" id="next-month" aria-label="다음 달">›</button>
            </div>
          </div>
          <div class="weekday-row" aria-hidden="true">
            <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
          </div>
          <div class="calendar-grid" id="calendar-grid" role="grid" aria-label="날짜 선택"></div>
          <div class="legend"><span class="legend-dot"></span><span>퇴사하고 싶은 날</span><span class="legend-count" id="month-count"></span></div>
        </section>

      </section>
      <dialog class="entry-dialog" id="entry-dialog" aria-labelledby="selected-date">
        <section class="entry-panel" aria-label="날짜 기록">
          <div class="entry-heading">
            <h2 id="selected-date">날짜를 골라주세요</h2>
            <button class="dialog-close" id="close-dialog" type="button" aria-label="기록 창 닫기">×</button>
          </div>
          <label class="field-label" for="note-input">어떤 일이 있었나요?</label>
          <textarea id="note-input" maxlength="240" disabled></textarea>
          <div class="note-meta"><span id="char-count">0 / 240</span></div>
          <div class="color-section">
            <div class="color-options" role="radiogroup" aria-label="점 색깔 선택">
              <button class="color-option selected" data-color="#d98270" aria-label="코랄" aria-checked="true" role="radio" style="--swatch:#d98270"></button>
              <button class="color-option" data-color="#d2a64f" aria-label="머스터드" aria-checked="false" role="radio" style="--swatch:#d2a64f"></button>
              <button class="color-option" data-color="#7e9c87" aria-label="세이지" aria-checked="false" role="radio" style="--swatch:#7e9c87"></button>
              <button class="color-option" data-color="#7895b2" aria-label="블루" aria-checked="false" role="radio" style="--swatch:#7895b2"></button>
              <button class="color-option" data-color="#a28caf" aria-label="라일락" aria-checked="false" role="radio" style="--swatch:#a28caf"></button>
            </div>
          </div>
          <div class="entry-actions">
            <button class="delete-button" id="delete-entry" type="button" hidden>기록 삭제</button>
            <button class="save-button" id="save-entry" type="button" disabled>Done</button>
          </div>
        </section>
      </dialog>
      <dialog class="confirm-dialog" id="delete-confirm" aria-labelledby="delete-title">
        <h2 id="delete-title">이 기록을 삭제할까요?</h2>
        <div class="confirm-actions">
          <button type="button" id="cancel-delete">취소</button>
          <button type="button" id="confirm-delete">삭제</button>
        </div>
      </dialog>
    </main>
    <script src="app.js"></script>
  </body>
</html>
